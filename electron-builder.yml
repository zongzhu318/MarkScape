appId: app.markscape.desktop
productName: MarkScape
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
asar: true
extraResources:
  - from: resources/bin
    to: bin
    filter: ['**/*', '!README.md']
fileAssociations:
  - ext: [md, markdown, mdown, mkd]
    name: Markdown document
    role: Editor
protocols:
  - name: MarkScape
    schemes: [mdview]
mac:
  icon: resources/icon.png
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  minimumSystemVersion: '13.0'
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  icon: resources/icon.png
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  category: Office
  maintainer: MarkScape contributors
